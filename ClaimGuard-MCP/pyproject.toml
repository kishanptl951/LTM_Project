[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claimguard-mcp"
version = "0.1.0"
description = "Multimodal Insurance Claim Consistency & Fraud Arbiter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "duckdb>=1.1.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.25.0",
    "pillow>=11.0.0",
    "pytesseract>=0.3.13",
    "requests>=2.31.0",
    "truststore>=0.9.0",
    "streamlit>=1.35.0",
    "reportlab>=4.1.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
claimguard = "src.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.pyright]
extraPaths = ["."]
venvPath = "."
venv = ".venv"

[tool.pyrefly]
search-path = ["."]
disable-search-path-heuristics = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
